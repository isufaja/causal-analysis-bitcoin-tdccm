[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-tdccm-reproduction"
version = "0.1.0"
description = "Reproduction code for time-delay convergent cross mapping on Bitcoin, S&P 500, and gold time series."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Albi Isufaj" }
]
dependencies = [
  "pyEDM @ git+https://github.com/SugiharaLab/pyEDM.git@bc7b850",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.6",
  "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
bitcoin-tdccm-preprocess = "bitcoin_tdccm.cli:preprocess_main"
bitcoin-tdccm-run = "bitcoin_tdccm.cli:run_tdccm_main"
bitcoin-tdccm-figures = "bitcoin_tdccm.cli:make_figures_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: full TDCCM parity tests; enable with RUN_SLOW_TDCCM=1",
]
